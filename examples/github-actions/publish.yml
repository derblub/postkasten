# GitHub Actions variant. Note: cron is UTC and can run minutes late; scheduled
# workflows pause after 60 days without repository activity.
# 4-19 UTC is 05:00-20:45 CET in winter and 06:00-21:45 CEST in summer, a
# superset of 06:00-20:45 Europe/Vienna all year (one harmless extra hour in
# each season). Posts dated outside the window by more than
# dueWindowHours (e.g. Friday evening, weekends) are skipped. Adjust for your zone.
name: publish
on:
  schedule:
    - cron: "*/15 4-19 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx postkasten publish
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
