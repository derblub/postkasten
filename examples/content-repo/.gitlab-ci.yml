# Scheduled publishing with postkasten.
#
# Pipeline schedules (CI/CD > Schedules), time zone Europe/Vienna:
#   TASK=publish   */15 6-20 * * 1-5
#   TASK=doctor    0 7 * * *
#
# CI/CD variables (masked, protected): LINKEDIN_ACCESS_TOKEN, LINKEDIN_CLIENT_ID,
# LINKEDIN_CLIENT_SECRET, BLUESKY_HANDLE, BLUESKY_APP_PASSWORD, NTFY_TOPIC,
# GIT_PUSH_TOKEN (project access token, role Developer, scope write_repository;
# allow it to push to the protected branch).

stages: [publish]

.node: &node
  image: node:24-alpine
  tags: [docker]
  before_script:
    - apk add --no-cache git
    - git remote set-url origin "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - npm install --no-audit --no-fund

publish:
  <<: *node
  stage: publish
  resource_group: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TASK == "publish"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - npx postkasten publish

doctor:
  <<: *node
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TASK == "doctor"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - npx postkasten doctor

validate:
  <<: *node
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - npx postkasten validate
