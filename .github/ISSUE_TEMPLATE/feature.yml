name: Feature request
description: An idea for a channel, a command or a check.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to post or check when the tool fell short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work? An example post file is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
